[package]
name = "open-xiao"
version = "0.1.1"
description = "Open Xiao desktop app"
authors = ["Open Xiao contributors"]
edition = "2021"

[lib]
name = "open_xiao_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros", "sync", "process", "io-util", "net"] }
tokio-util = "0.7"
axum = "0.8"
rmcp = { version = "3.1.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
rand = "0.9"
base64 = "0.22"
cap-std = "4.0.2"
cap-fs-ext = "4.0.2"
aes-gcm = "0.11"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
url = "2"
regex = "1"
ignore = "0.4"
pdf-extract = "0.12"
tauri-plugin-dialog = "2.7.2"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-notification = "2"
portable-pty = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }
webview2-com = "0.38.2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
